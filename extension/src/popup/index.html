<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>WhaleWatch 𝕏 Publisher</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #14171a;
        --muted: #657786;
        --line: #e1e8ed;
        --ok: #17bf63;
        --warn: #ffad1f;
        --bad: #e0245e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e7e9ea;
          --muted: #8b98a5;
          --line: #2f3336;
        }
      }
      body {
        width: 330px;
        margin: 0;
        padding: 14px;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--fg);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ver {
        color: var(--muted);
        font-weight: 400;
        font-size: 11px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-of-type {
        border-bottom: 0;
      }
      .muted {
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
      }
      .banner {
        padding: 8px 10px;
        border-radius: 6px;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .banner.bad {
        background: rgba(224, 36, 94, 0.12);
        border: 1px solid var(--bad);
      }
      .banner.info {
        background: rgba(101, 119, 134, 0.12);
        border: 1px solid var(--line);
      }
      button {
        font: inherit;
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 6px 0 0;
        max-height: 168px;
        overflow: auto;
        font-size: 12px;
      }
      li {
        display: flex;
        gap: 6px;
        padding: 3px 0;
      }
      code {
        font-size: 11px;
      }
      .actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>🐳 WhaleWatch <span class="ver" id="ver"></span></h1>
    <div id="banner"></div>
    <div id="body"></div>
    <div class="actions">
      <button id="run">立即拉取</button>
      <button id="disconnect">断开连接</button>
    </div>
    <h2 style="font-size: 12px; margin: 12px 0 0">最近结果</h2>
    <ul id="recent"></ul>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
