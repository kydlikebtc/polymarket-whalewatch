services:
    whalewatch:
        build:
            context: .
            dockerfile: Dockerfile
        image: polymarket-whalewatch:latest
        container_name: polymarket-whalewatch
        restart: unless-stopped
        # Loads TELEGRAM_*, LARGE_THRESHOLDS, POLL_INTERVAL_MS from .env.
        env_file:
            - .env
        environment:
            # Fixed in-container values; override the host PORT and DB path so the
            # dashboard + embedded engine agree on the volume-backed SQLite file.
            PORT: '3000'
            DASH_DB: /app/data/data.sqlite
        ports:
            # host:container — change the left side to expose a different host port.
            - '61001:3000'
        volumes:
            - whalewatch-data:/app/data
        # Engine-loop liveness (not just "port answers"): /api/health returns
        # 503 when any engine loop stops beating, so `docker ps` shows
        # (unhealthy) for hangs too. Pair with HEALTHCHECK_PING_URL in .env for
        # push alerts that survive the whole host going down.
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            interval: 60s
            timeout: 15s
            retries: 3
            # next start + first loop beats need a moment on cold boot.
            start_period: 300s

volumes:
    whalewatch-data:
