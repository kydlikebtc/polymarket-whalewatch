name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run's verdict irrelevant —
# cancel it instead of paying for two answers about code that no longer exists.
# Note: only github.workflow and github.ref are interpolated here, and never
# inside a `run:` script — no attacker-controlled github.event.* value is ever
# expanded into a shell command in this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow only compiles and runs tests. It posts no comments, cuts no
# releases, publishes no packages — so read access to the repo is all it needs.
permissions:
  contents: read

jobs:
  test:
    # Renamed from "typecheck + unit tests" when the build step landed. Safe to
    # rename because main carries no branch protection, so no required status
    # check is pinned to the old string — recheck that before renaming again.
    name: typecheck + unit tests + build
    runs-on: ubuntu-latest

    steps:
      # v7, not v4: v4 runs on node20, which GitHub deprecated — those runs were
      # already being force-migrated to node24 with a warning. checkout ships
      # `runs.using: node24` from v5 onward, so v5 alone would silence the
      # warning; v7 is picked to avoid repeating this chore in two months.
      # Neither post-v5 breaking change reaches this workflow: v6 moved git
      # credentials into a separate file (nothing here writes to git), and v7
      # blocks fork-PR checkout under pull_request_target/workflow_run (this
      # workflow triggers on push/pull_request only).
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 mirrors the Dockerfile, which uses node:22-bookworm-slim for
      # BOTH the builder and the runner stage. Keeping CI on the same major
      # version means what passes here is compiled against what ships.
      # (package.json has no "engines" field, so the Dockerfile is the only
      # place this project actually pins a Node version.)
      #
      # `cache: 'npm'` is stated explicitly and stays that way. setup-node v5
      # added implicit caching driven by package.json's `packageManager` field
      # and v6 narrowed that to npm only, but this project declares no
      # `packageManager`, so the implicit path would cache nothing. The explicit
      # input still exists in v7 with unchanged semantics (npm/yarn/pnpm) and
      # takes effect regardless of what the implicit detection concludes.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci, not npm install: package-lock.json is committed and CI should
      # fail loudly on lockfile drift rather than silently resolving around it.
      # better-sqlite3 is a native module; ubuntu-latest ships python3/make/g++,
      # matching what the Dockerfile builder stage installs for the same reason.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # vitest run. No secrets are wired into this workflow on purpose: the
      # suite passes against a bare checkout with no .env file present.
      - name: Unit tests
        run: npm test

      # `next build`, and specifically the **webpack** one. Not redundant with
      # Typecheck above, for a reason worth spelling out because it is easy to
      # "simplify" this step away:
      #
      # Next validates every route/page against its own export whitelist
      # (GET/POST/runtime/dynamic/…) through assertion files it GENERATES into
      # .next/types at build time. tsconfig.json does include .next/types/**,
      # so `tsc --noEmit` checks them — but only the ones already sitting on
      # disk. .next/ is gitignored, CI checks out bare, and Typecheck runs
      # first, so on a CI run there are no assertion files to check and the
      # Typecheck step is green no matter what a route.ts exports. An extra
      # export — e.g. a test-only cache reset hook — therefore reached main
      # with both CI steps passing, and broke only at build time.
      #
      # Why `build:webpack` and not `build`: on Next 16 the default builder is
      # Turbopack, and the Turbopack path does not emit the per-route assertion
      # files (measured: 3 files under .next/types vs 63 for webpack). The same
      # illegal route export exits 0 under Turbopack and 1 under webpack — so
      # `npm run build` here would be a gate that catches nothing. The webpack
      # path is already load-bearing for this project (next.config keeps a
      # webpack fallback for git-worktree runs, where Turbopack panics on the
      # symlinked node_modules), so keeping it green costs no extra upkeep.
      #
      # Cost: ~10s on a warm laptop, budget under a minute on ubuntu-latest —
      # it reuses this job's `npm ci`, so the marginal spend is the build alone.
      # Needs no env: every route is force-dynamic, nothing is prerendered, and
      # the build opens no database (verified on a bare checkout with no .env
      # and no data.sqlite present).
      #
      # NOTE: Turbopack — what Dockerfile's `npm run build` actually ships — is
      # deliberately NOT built here. The deploy already exercises it, and paying
      # for a second full build to learn the same thing a few minutes earlier is
      # not worth the CI minutes.
      - name: Build (webpack — validates route export shape)
        run: npm run build:webpack
